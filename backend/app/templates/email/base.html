<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}ARTPARK{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1a1a1a;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f4f1ea;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="max-width:560px;background:#ffffff;border:1px solid #d7d1c2;">
          <tr>
            <td style="padding:20px 28px;border-bottom:1px solid #d7d1c2;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.1em;color:#8a867c;text-transform:uppercase;">
              ARTPARK &nbsp;·&nbsp; IISc Bangalore
            </td>
          </tr>
          <tr>
            <td style="padding:28px;font-size:15px;line-height:1.6;color:#1a1a1a;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;border-top:1px solid #d7d1c2;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:11px;color:#8a867c;">
              ARTPARK at IISc &nbsp;·&nbsp; Bengaluru &nbsp;·&nbsp; <a href="https://artpark.in" style="color:#8a867c;text-decoration:underline;">artpark.in</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
