<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light only" />
  <title>{% block title %}ARTPARK{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f6f6f8;font-family:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#242424;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f6f6f8;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="max-width:560px;background:#ffffff;border:1px solid #e4e2ee;">
          <tr>
            <td bgcolor="#ffffff" align="center" style="background-color:#ffffff;padding:24px 28px 18px;text-align:center;">
              <img src="https://xtmszlpwgbyoumalgbhs.supabase.co/storage/v1/object/public/email-assets/artpark-iisc-logo.png" alt="ARTPARK — AI &amp; Robotics Technology Park @ IISc" width="270" height="54" style="display:block;margin:0 auto;width:270px;max-width:72%;height:auto;border:0;outline:none;text-decoration:none;" />
            </td>
          </tr>
          <tr>
            <td bgcolor="#3213b7" align="center" style="background-color:#3213b7;padding:12px 28px;text-align:center;">
              <div style="font-family:'Open Sans',Helvetica,Arial,sans-serif;font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:#c9bdf5;">{% block header_sublabel %}{% endblock %}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;font-size:15px;line-height:1.6;color:#242424;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;border-top:1px solid #ececf2;font-family:'Open Sans',Helvetica,Arial,sans-serif;font-size:11px;color:#9a96a8;">
              ARTPARK at IISc &nbsp;·&nbsp; Bengaluru &nbsp;·&nbsp; <a href="https://artpark.in" style="color:#9a96a8;text-decoration:underline;">artpark.in</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
