# pyproject.toml — project metadata + ruff + pytest config.
# Dependencies live in requirements.txt (not here) so Lambda + pip-install flows
# stay first-class. The [project] table only carries metadata (name, version)
# that the app reads at runtime via config.APP_VERSION.

[project]
name = "artpark-eir-backend"
version = "0.8.0"
description = "FastAPI backend for the ARTPARK EIR application portal"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"   # code must run on 3.11+ per Phase 2 spec
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line length — ruff formatter handles it
  "B008", # Depends(...) in default args (idiomatic in FastAPI)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert in tests is fine
"__init__.py" = ["F401"]  # re-exports

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: tests that hit real external services (Supabase, OpenRouter). Skipped by default; run with `pytest -m integration`.",
]
# Default filter: skip @pytest.mark.integration unless explicitly requested.
addopts = "-m 'not integration' --cov=app --cov-report=term-missing --cov-fail-under=70"
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  "app/__init__.py",
  "app/models/__init__.py",
  "app/routers/__init__.py",
  "app/services/__init__.py",
  "app/utils/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
