<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARTPARK OS — Jury Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ARTPARK OS — Selection System
   Shared design tokens carried from EIR Application aesthetic.
   ========================================================= */

:root {
  /* ARTPARK brand — aligned to Leadership module design system */
  --artblue: #3213b7;
  --artblue-deep: #1f0a8a;
  --artlight: #aafcf0;
  --artblack: #242424;
  --artwhite: #efefef;
  --brand-coral: #FF5A5F;
  --brand-amber: #FFB703;
  --brand-green: #2F6F62;
  --brand-violet: #6B5CFF;

  /* Semantic accents (leadership names) */
  --accent-coral:  #FF5A5F;
  --accent-amber:  #FFB703;
  --accent-green:  #2F6F62;
  --accent-violet: #6B5CFF;

  /* Core palette — clean white */
  --bg: #ffffff;
  --bg-soft: #f6f6f8;
  --bg-paper: #ffffff;
  --paper: #ffffff;
  --paper-soft: #f6f6f8;
  --ink: #242424;
  --ink-soft: #4a4a52;
  --ink-dim: #8a8a92;
  --line: #e3e3e8;
  --line-strong: #c8c8d0;
  --accent: #3213b7;
  --accent-soft: #d8d0f3;
  --chip: #f6f6f8;

  /* Layer-coded accents (harmonized to leadership family) */
  --l1-blue: #3213b7;
  --l2-cyan: #6B5CFF;
  --l3-amber: #b7a06a;
  --l4-green: #2F6F62;
  --l5-purple: #6B5CFF;
  --l6-slate: #4a4a52;
  --l7-emerald: #2F6F62;

  /* Category accents (6-cat scoring) — distinct hues, all from the leadership palette */
  --cat-problem:   #3213b7;
  --cat-solution:  #6B5CFF;
  --cat-tech:      #2F6F62;
  --cat-founders:  #b7a06a;
  --cat-commit:    #b85a3a;
  --cat-integrity: #4a4a52;

  /* Status palette — mapped to leadership 4-bucket scheme */
  --ok: #2a8f5a;
  --ok-soft: #cfe5df;
  --warn: #b7a06a;
  --warn-soft: #fbf3e0;
  --bad: #FF5A5F;
  --bad-soft: #ffd9da;
  --info: #3213b7;
  --info-soft: #d8d0f3;

  --gridcell: 36px;
  --grid-opacity: 0.55;

  /* Type — strict leadership parity: Trebuchet display + Open Sans everywhere
     (incl. eyebrows/labels). True monospace reserved for codes/IDs only. */
  --font-serif:   "Trebuchet MS", "Lucida Grande", Tahoma, sans-serif;
  --font-display: "Trebuchet MS", "Lucida Grande", Tahoma, sans-serif;
  --font-sans:    "Open Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-body:    "Open Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono:    "Open Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-code:    ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --radius: 2px;
  --radius-md: 2px;
  --radius-lg: 3px;

  /* Spacing scale (leadership) */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 32px; --s-7: 48px; --s-8: 64px; --s-9: 96px; --s-10: 128px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}

/* Clean white backdrop */
.os-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: var(--bg);
}

/* === Top chrome === */
.os-shell {
  position: relative; z-index: 1; min-height: 100vh;
  display: flex; flex-direction: column;
}
.os-topbar {
  display: flex; align-items: center; gap: 20px;
  padding: 0 24px; height: 48px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-paper);
}
.os-brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-sans); font-size: 14px; font-weight: 700; color: var(--ink); }
.os-brand-mark { width: 24px; height: 24px; border: 1.5px solid var(--line-strong); border-radius: 5px; display: grid; place-items: center; font-family: var(--font-serif); font-style: italic; font-size: 13px; color: var(--ink); }
.os-brand-sep { color: var(--line-strong); font-size: 16px; font-weight: 300; }
.os-brand b { color: var(--ink); font-weight: 700; }
.os-portal-tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; padding: 3px 8px; border: 1px solid var(--line); background: var(--bg-soft); color: var(--ink-dim); text-transform: uppercase; border-radius: 3px; }
.os-spacer { flex: 1; }
.os-cohort {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
  border: 1px solid var(--line); background: var(--bg-paper);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft);
  cursor: pointer; border-radius: 3px;
}
.os-cohort .caret { color: var(--ink-dim); font-size: 9px; }
.os-bell { position: relative; padding: 6px; border: 1px solid var(--line); background: var(--bg-paper); cursor: pointer; border-radius: 3px; }
.os-bell .dot { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
.os-user { display: flex; align-items: center; gap: 8px; }
.os-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 11px; }
.os-user-name { font-size: 13px; font-weight: 500; color: var(--ink); }
.os-user-role { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); }

/* === Body grid (sidebar + content) === */
.os-body { display: flex; flex: 1; min-height: 0; }
.os-body.no-sidebar { }
.os-sidebar { flex-shrink: 0; width: 220px; }
.os-sidebar {
  width: 220px; flex-shrink: 0;
  border-right: 1px solid var(--line);
  background: var(--bg-paper);
  padding: 16px 0;
  overflow-y: auto;
}
.os-nav-section { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); padding: 14px 18px 5px; }
.os-nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 18px; cursor: pointer;
  font-size: 13px; font-weight: 500; color: var(--ink-soft);
  border-left: 2px solid transparent;
}
.os-nav-item:hover { background: var(--bg-soft); color: var(--ink); }
.os-nav-item.active { background: var(--bg-soft); color: var(--ink); border-left-color: var(--accent); font-weight: 600; }
.os-nav-item .num { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-dim); width: 24px; }
.os-nav-item.active .num { color: var(--accent); }
.os-nav-item .badge { margin-left: auto; font-family: var(--font-mono); font-size: 10px; padding: 1px 7px; background: var(--accent); color: white; border-radius: 10px; }

.os-main { flex: 1; padding: 28px 32px 80px; min-width: 0; overflow: auto; }
.os-page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
.os-eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 6px; }
.os-h1 { font-family: var(--font-serif); font-weight: 400; font-size: 36px; line-height: 1.1; letter-spacing: -0.01em; margin: 0; color: var(--ink); }
.os-h1 em { font-style: italic; color: var(--accent); }
.os-sub { font-size: 13px; color: var(--ink-soft); margin-top: 8px; max-width: 60ch; }
.os-breadcrumb { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; color: var(--ink-dim); margin-bottom: 8px; }
.os-breadcrumb a { color: var(--ink-soft); text-decoration: none; }
.os-breadcrumb a:hover { color: var(--accent); }
.os-breadcrumb .sep { margin: 0 6px; color: var(--line-strong); }

/* === Buttons === */
.os-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 16px; font-family: var(--font-display); font-size: 13px; font-weight: 600; border: 1px solid var(--ink); background: var(--ink); color: white; cursor: pointer; letter-spacing: 0.01em; border-radius: var(--radius); }
.os-btn:hover { background: var(--accent); border-color: var(--accent); }
.os-btn.secondary { background: transparent; color: var(--ink); }
.os-btn.secondary:hover { background: var(--bg-soft); color: var(--ink); border-color: var(--line-strong); }
.os-btn.ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); }
.os-btn.ghost:hover { background: var(--bg-soft); color: var(--ink); border-color: var(--line-strong); }
.os-btn.danger { background: var(--bad); border-color: var(--bad); color: white; }
.os-btn.danger:hover { background: #c8413f; border-color: #c8413f; }
.os-btn.sm { padding: 5px 10px; font-size: 12px; }
.os-btn:disabled { opacity: 0.4; cursor: not-allowed; }
/* Highlighted toggle (e.g. Show AI Scores) — draws attention */
.os-btn.highlight {
  background: #ece9fb; border-color: #3213b7; color: #3213b7; font-weight: 700;
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.18);
}
.os-btn.highlight:hover { background: #3213b7; border-color: #3213b7; color: #fff; }

/* === Cards / panels === */
.os-card { background: var(--bg-paper); border: 1px solid #e3e3e8; padding: 22px; border-radius: 6px; }
.os-card.soft { background: var(--bg-soft); }
.os-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.os-card-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.os-card-meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); }

/* === Chips & flags === */
/* Status chip — leadership StatusChip parity: neutral pill, colored dot, neutral label */
.os-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--line); background: var(--paper-soft);
  font-family: var(--font-body); font-size: 11px; font-weight: 600;
  letter-spacing: 0.04em; text-transform: none;
  color: var(--ink-soft); border-radius: var(--r-pill, 999px); white-space: nowrap;
}
/* Colored bucket dot — the colour lives in the dot, the label stays neutral */
.os-chip.green::before,
.os-chip.amber::before,
.os-chip.blue::before,
.os-chip.red::before,
.os-chip.cyan::before,
.os-chip.purple::before,
.os-chip.indigo::before,
.os-chip.teal::before,
.os-chip.slate::before {
  content: ''; display: inline-block;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--chip-dot, var(--ink-dim)); flex-shrink: 0;
}
.os-chip.blue   { --chip-dot: var(--artblue); }
.os-chip.cyan   { --chip-dot: var(--accent-green); }
.os-chip.amber  { --chip-dot: #b7a06a; }
.os-chip.green  { --chip-dot: #2a8f5a; }
.os-chip.purple { --chip-dot: var(--accent-violet); }
.os-chip.indigo { --chip-dot: #4338ca; color: #312e81; background: #eef2ff; border-color: #c7d2fe; }
.os-chip.slate  { --chip-dot: var(--ink-dim); }
.os-chip.red    { --chip-dot: var(--accent-coral); }
.os-chip.teal   { --chip-dot: var(--accent-green); }

/* Solid filled variants (status fills) */
.os-chip.solid { color: #fff; border-color: transparent; }
.os-chip.solid::before { background: #fff; }
.os-chip.solid.blue   { background: var(--info);  }
.os-chip.solid.green  { background: var(--ok);    }
.os-chip.solid.amber  { background: var(--warn);  }
.os-chip.solid.red    { background: var(--bad);   }

.os-flag-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.os-flag-dot.darkgreen { background: #234f44; }
.os-flag-dot.green { background: #2f6f62; }
.os-flag-dot.orange { background: #b85a3a; }

/* === Score bar === */
.os-scorebar { display: grid; grid-template-columns: 110px 1fr 36px; gap: 12px; align-items: center; padding: 5px 0; }
.os-scorebar-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--ink); font-weight: 700; text-transform: uppercase; line-height: 1.35; }
.os-scorebar-track { position: relative; height: 5px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.os-scorebar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.os-scorebar-tick { position: absolute; top: -2px; bottom: -2px; width: 1px; background: rgba(0,0,0,0.2); }
.os-scorebar-val { font-family: var(--font-sans); font-size: 14px; font-weight: 700; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }

/* category fills */
.os-scorebar.problem .os-scorebar-fill { background: var(--cat-problem); }
.os-scorebar.solution .os-scorebar-fill { background: var(--cat-solution); }
.os-scorebar.tech .os-scorebar-fill { background: var(--cat-tech); }
.os-scorebar.founders .os-scorebar-fill { background: var(--cat-founders); }
.os-scorebar.commit .os-scorebar-fill { background: var(--cat-commit); }
.os-scorebar.integrity .os-scorebar-fill { background: var(--cat-integrity); }

/* === Tables === */
.os-table { width: 100%; border-collapse: collapse; background: var(--bg-paper); }
.os-table th, .os-table td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
.os-table th { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; background: var(--bg-soft); position: sticky; top: 0; border-bottom: 1px solid var(--line); }
.os-table tbody tr:hover { background: #f6f6f8; }
.os-table .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.os-table .startup { font-weight: 600; color: var(--ink); }
.os-table .startup small { display: block; font-weight: 400; color: var(--ink-dim); font-size: 11px; margin-top: 2px; font-family: var(--font-mono); }

/* === Filter bar === */
.os-filterbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--bg-paper); border: 1px solid var(--line); border-bottom: none; border-radius: var(--radius-md) var(--radius-md) 0 0; }
.os-filterbar .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin-right: 4px; }
.os-select, .os-input {
  padding: 0 10px; height: 30px; border: 1px solid #c8c8d0; background: #fff;
  font-family: var(--font-sans); font-size: 13px; color: var(--ink); border-radius: 2px;
  outline: none; -webkit-font-smoothing: antialiased;
}
textarea.os-input { height: auto; min-height: 88px; padding: 8px 10px; resize: vertical; line-height: 1.55; }
.os-select:focus, .os-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #d8d0f3; }
.os-input.search { padding-left: 30px; width: 220px; }
.os-search-wrap { position: relative; flex-shrink: 0; }
.os-search-wrap::before { content: "⌕"; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #8a8a92; font-size: 15px; pointer-events: none; }

/* === Stat tiles === */
.os-stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0; border: 1px solid var(--line); background: var(--bg-paper); border-radius: var(--radius-md); overflow: hidden; }
.os-stat { padding: 18px; border-right: 1px solid var(--line); cursor: pointer; transition: background 120ms; }
.os-stat:last-child { border-right: none; }
.os-stat:hover { background: var(--bg-soft); }
.os-stat-num { font-family: var(--font-serif); font-size: 30px; font-weight: 400; color: var(--ink); line-height: 1; }
.os-stat-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin-top: 8px; }
.os-stat-meta { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
.os-stat-action { display: inline-block; margin-top: 6px; padding: 2px 7px; background: var(--accent); color: white; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; border-radius: 2px; }
.os-stat.l1 { border-top: 3px solid var(--l1-blue); }
.os-stat.l2 { border-top: 3px solid var(--l2-cyan); }
.os-stat.l3 { border-top: 3px solid var(--l3-amber); }
.os-stat.l4 { border-top: 3px solid var(--l4-green); }
.os-stat.l5 { border-top: 3px solid var(--l5-purple); }
.os-stat.l6 { border-top: 3px solid var(--l6-slate); }
.os-stat.l7 { border-top: 3px solid var(--l7-emerald); }

/* === Common section grid === */
.os-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.os-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.os-grid-sidebar { display: grid; grid-template-columns: 1fr 320px; gap: 18px; }
.os-grid-evaluation { display: grid; grid-template-columns: 1fr 380px; gap: 18px; }
.os-grid-profile { display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
.os-profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.os-profile-grid .lab { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 4px; }
.os-profile-grid .val { font-size: 14px; font-weight: 500; color: var(--ink); }

.os-divider { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }

/* mono number display */
.os-num-big { font-family: var(--font-serif); font-size: 56px; line-height: 1; color: var(--ink); font-weight: 400; }
.os-num-big small { font-family: var(--font-mono); font-size: 16px; color: var(--ink-dim); margin-left: 2px; }

/* Banner */
.os-banner { padding: 14px 18px; border: 1px solid var(--line); background: var(--bg-paper); display: flex; gap: 16px; align-items: center; border-radius: var(--radius-md); }
.os-banner.blue { border-left: 3px solid var(--info); background: var(--info-soft); }
.os-banner.amber { border-left: 3px solid var(--warn); background: var(--warn-soft); }
.os-banner.green { border-left: 3px solid var(--ok); background: var(--ok-soft); }
.os-banner.purple { border-left: 3px solid var(--l5-purple); background: #efedff; }
.os-banner.red { border-left: 3px solid var(--bad); background: var(--bad-soft); }
.os-banner.slate { border-left: 3px solid var(--l6-slate); background: var(--bg-soft); }
.os-banner-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 4px; }
.os-banner-text { font-size: 14px; color: var(--ink); }

/* Timeline (founder F-4) */
.os-timeline { display: flex; flex-direction: column; gap: 0; }
.os-tl-item { display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding: 12px 0; position: relative; }
.os-tl-item::before { content: ""; position: absolute; left: 17px; top: 32px; bottom: -8px; width: 2px; background: var(--line); }
.os-tl-item:last-child::before { display: none; }
.os-tl-node { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-soft); border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); position: relative; z-index: 1; }
.os-tl-item.done .os-tl-node { background: var(--ok); border-color: var(--ok); color: white; }
.os-tl-item.active .os-tl-node { background: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 0 0 4px var(--accent-soft); }
.os-tl-item.done::before { background: var(--ok); }
.os-tl-label { font-weight: 600; color: var(--ink); font-size: 14px; }
.os-tl-meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); margin-top: 3px; }
.os-tl-item.future .os-tl-label { color: var(--ink-dim); font-weight: 400; }

/* Sliders (reviewer / jury) */
.os-slider-row { display: grid; grid-template-columns: 130px 1fr 50px; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.os-slider-row:last-child { border-bottom: none; }
.os-slider-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); font-weight: 700; line-height: 1.35; }
.os-slider-track { position: relative; height: 28px; cursor: pointer; }
.os-slider-track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 2px; transform: translateY(-50%); }
.os-slider-fill { position: absolute; left: 0; top: 50%; height: 4px; background: var(--accent); border-radius: 2px; transform: translateY(-50%); transition: width 80ms; }
.os-slider-thumb { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; background: white; border: 2px solid var(--accent); border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,0.15); transition: left 80ms; }
.os-slider-tick { position: absolute; top: 50%; transform: translateY(-50%); width: 1px; height: 8px; background: var(--line-strong); }
.os-slider-val { font-family: var(--font-sans); font-size: 16px; font-weight: 700; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

.os-slider-row.problem .os-slider-fill { background: var(--cat-problem); }
.os-slider-row.problem .os-slider-thumb { border-color: var(--cat-problem); }
.os-slider-row.solution .os-slider-fill { background: var(--cat-solution); }
.os-slider-row.solution .os-slider-thumb { border-color: var(--cat-solution); }
.os-slider-row.tech .os-slider-fill { background: var(--cat-tech); }
.os-slider-row.tech .os-slider-thumb { border-color: var(--cat-tech); }
.os-slider-row.founders .os-slider-fill { background: var(--cat-founders); }
.os-slider-row.founders .os-slider-thumb { border-color: var(--cat-founders); }
.os-slider-row.commit .os-slider-fill { background: var(--cat-commit); }
.os-slider-row.commit .os-slider-thumb { border-color: var(--cat-commit); }
.os-slider-row.integrity .os-slider-fill { background: var(--cat-integrity); }
.os-slider-row.integrity .os-slider-thumb { border-color: var(--cat-integrity); }

/* Reco buttons (Yes/Maybe/No) */
.os-reco-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.os-reco-btn { padding: 11px; border: 1px solid var(--line); background: var(--bg-paper); cursor: pointer; font-family: var(--font-display); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); border-radius: var(--radius-md); font-weight: 600; }
.os-reco-btn:hover { background: var(--bg-soft); border-color: var(--line-strong); }
.os-reco-btn.yes.active { background: var(--ok); border-color: var(--ok); color: white; }
.os-reco-btn.maybe.active { background: var(--warn); border-color: var(--warn); color: white; }
.os-reco-btn.no.active { background: var(--bad); border-color: var(--bad); color: white; }
.os-reco-btn.approve.active { background: var(--ok); border-color: var(--ok); color: white; }
.os-reco-btn.waitlist.active { background: var(--warn); border-color: var(--warn); color: white; }
.os-reco-btn.reject.active { background: var(--bad); border-color: var(--bad); color: white; }

/* Radar chart */
.os-radar { width: 100%; height: 280px; }
.os-radar polygon.grid { fill: none; stroke: var(--line); }
.os-radar polygon.fill { fill: rgba(8, 145, 178, 0.18); stroke: var(--l2-cyan); stroke-width: 1.5; }
.os-radar polygon.fill.reviewer { fill: rgba(4, 120, 87, 0.18); stroke: var(--l4-green); }
.os-radar text { font-family: var(--font-mono); font-size: 10px; fill: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase; }
.os-radar circle.point { fill: var(--l2-cyan); }

/* Variance pill */
.os-variance { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; border-radius: 4px; font-weight: 500; }
.os-variance.low { background: var(--ok-soft); color: var(--ok); }
.os-variance.med { background: var(--warn-soft); color: var(--warn); }
.os-variance.high { background: var(--bad-soft); color: var(--bad); }

/* scoring.md panel */
.os-rubric { background: #242424; color: #e3e3e8; padding: 16px 18px; font-family: var(--font-code); font-size: 12px; line-height: 1.6; }
.os-rubric .head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #242424; color: #2a8f5a; }
.os-rubric .ver { color: #8a8a92; font-size: 10px; }
.os-rubric h4 { color: #f3e0d8; font-family: var(--font-code); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin: 12px 0 4px; }
.os-rubric pre { margin: 0; white-space: pre-wrap; color: #e3e3e8; }
.os-rubric .anchor { color: #2a8f5a; }

/* Histogram */
.os-histogram { display: flex; align-items: flex-end; gap: 3px; height: 70px; padding: 8px 0; }
.os-histogram .bar { flex: 1; background: var(--ink); opacity: 0.8; min-height: 4px; }
.os-histogram .bar.cutoff { background: var(--accent); opacity: 1; }
.os-histogram .bar.lowscore { opacity: 0.35; }

/* Toast hint */
.os-help { font-size: 12px; color: var(--ink-dim); font-style: italic; }

/* Modals */
.os-modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.45); display: grid; place-items: center; z-index: 50; padding: 24px; backdrop-filter: blur(2px); }
.os-modal { background: var(--bg-paper); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: 0 20px 60px rgba(15,23,42,0.15); max-width: 720px; width: 100%; max-height: 86vh; overflow: auto; }
.os-modal-head { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.os-modal-body { padding: 22px; }
.os-modal-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }

/* Audit log */
.os-audit { font-family: var(--font-mono); font-size: 12px; }
.os-audit-row { display: grid; grid-template-columns: 130px 180px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.os-audit-row .ts { color: var(--ink-dim); }
.os-audit-row .act { color: var(--ink); }
.os-audit-row .desc { color: var(--ink-soft); }

/* Utility */
.os-mono { font-family: var(--font-code); }
.os-serif { font-family: var(--font-serif); }
.os-row { display: flex; align-items: center; gap: 10px; }
.os-row.gap-sm { gap: 6px; }
.os-row.gap-lg { gap: 18px; }
.os-row.between { justify-content: space-between; }
.os-stack { display: flex; flex-direction: column; gap: 12px; }
.os-stack.gap-sm { gap: 6px; }
.os-stack.gap-lg { gap: 24px; }
.os-pad { padding: 24px; }
.os-mt-sm { margin-top: 8px; } .os-mt { margin-top: 16px; } .os-mt-lg { margin-top: 28px; }
.os-mb-sm { margin-bottom: 8px; } .os-mb { margin-bottom: 16px; } .os-mb-lg { margin-bottom: 28px; }
.os-text-dim { color: var(--ink-dim); }
.os-text-soft { color: var(--ink-soft); }
.os-text-accent { color: var(--accent); }
.os-uppercase { text-transform: uppercase; letter-spacing: 0.14em; font-family: var(--font-mono); font-size: 11px; }
.os-text-sm { font-size: 12px; }
.os-text-xs { font-size: 11px; }
.os-w-100 { width: 100%; }

/* Tabs */
.os-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.os-tab { padding: 10px 16px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ink-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.os-tab:hover { color: var(--ink); }
.os-tab.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

/* Notification panel */
.os-notif { padding: 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.os-notif:hover { background: var(--bg-soft); }
.os-notif.unread { border-left: 3px solid var(--accent); }
.os-notif-title { font-weight: 600; font-size: 13px; }
.os-notif-time { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); margin-top: 2px; }
.os-notif-body { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }


/* =========================================================
   JURY CONSOLE — modern, systematic
   ========================================================= */

/* Live console header */
.os-live-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--brand-coral);
  box-shadow: 0 0 0 0 rgba(255,90,95,0.55);
  animation: os-live-pulse 1.6s infinite;
  margin-right: 8px; vertical-align: middle;
}
@keyframes os-live-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(255,90,95,0.55); }
  70%  { box-shadow: 0 0 0 10px rgba(255,90,95,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,90,95,0); }
}
.live-pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--brand-coral); animation: os-live-pulse 1.6s infinite;
}

/* Top status (clock) */
.os-jury-status { display: flex; align-items: stretch; }
.os-jury-clock {
  border: 1px solid var(--line-strong);
  background: var(--bg-paper);
  padding: 10px 18px;
  display: flex; flex-direction: column; align-items: flex-end;
  min-width: 180px;
}
.os-jury-clock .num {
  font-family: var(--font-serif); font-size: 28px; line-height: 1;
  color: var(--accent); letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.os-jury-clock .lab {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-dim); margin-top: 6px;
}

/* Three-column grid */
.os-grid-juryconsole {
  display: grid;
  grid-template-columns: 280px 1fr 320px;
  gap: 16px;
  align-items: start;
}

/* LEFT: pitch order rail */
.os-pitch-rail { padding: 16px; position: sticky; top: 16px; }
.os-pitch-row {
  display: grid;
  grid-template-columns: 36px 1fr auto;
  align-items: center; gap: 12px;
  padding: 10px 12px;
  border: 1px solid transparent;
  border-left: 2px solid var(--line);
  background: transparent;
  cursor: pointer;
  transition: background 120ms, border-color 120ms;
}
.os-pitch-row:hover { background: var(--bg-soft); }
.os-pitch-row .num {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
  color: var(--ink-dim);
}
.os-pitch-row .meta .name { font-weight: 500; font-size: 14px; color: var(--ink); }
.os-pitch-row .meta .time {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-dim); margin-top: 2px;
}
.os-pitch-row.done {
  border-left-color: var(--ok);
}
.os-pitch-row.done .num { color: var(--ok); }
.os-pitch-row.done .meta .name { color: var(--ink-soft); }
.os-pitch-row.live {
  background: var(--accent-soft);
  border-left-color: var(--accent);
}
.os-pitch-row.live .num { color: var(--accent); font-weight: 600; }
.os-pitch-row.live .meta .name { color: var(--ink); font-weight: 600; }
.os-pitch-row.live .meta .time { color: var(--accent); }
.os-pitch-row.upcoming { opacity: 0.85; }

/* CENTER: pitch stage */
.os-pitch-stage {
  margin-top: 16px;
  background: linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%);
  border: 1px solid var(--line);
  padding: 14px;
}
.os-pitch-deck-frame {
  background: #fff;
  border: 1px solid var(--line-strong);
  aspect-ratio: 16 / 9;
  position: relative;
  padding: 36px 40px;
  display: flex; flex-direction: column; justify-content: center;
  box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 12px 32px rgba(36,36,36,0.06);
}
.os-pitch-deck-frame .slide-corner {
  position: absolute; top: 14px; right: 18px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-dim);
}
.os-pitch-deck-frame .slide-content { width: 100%; }
.os-pitch-deck-frame .slide-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 0; border-top: 1px solid var(--line);
  padding-top: 18px; margin-top: 8px;
}
.os-pitch-deck-frame .slide-stats > div {
  display: flex; flex-direction: column; gap: 4px;
  padding-right: 16px; border-right: 1px solid var(--line);
}
.os-pitch-deck-frame .slide-stats > div:last-child { border-right: none; }
.os-pitch-deck-frame .slide-stats .big {
  font-family: var(--font-serif); font-size: 32px; line-height: 1;
  color: var(--accent); letter-spacing: -0.02em;
}
.os-pitch-deck-frame .slide-stats > div > span:last-child {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-dim);
}

/* Live notes */
.os-notes-prefilled {
  border-left: 2px solid var(--accent);
  padding: 4px 0 4px 16px;
  background: linear-gradient(90deg, var(--accent-soft) 0%, transparent 6%);
}
.os-notes-prefilled p {
  margin: 0 0 10px;
  font-size: 14px; line-height: 1.55; color: var(--ink-soft);
}
.os-notes-prefilled p:last-child { margin-bottom: 0; }

/* RIGHT: scoring sliders — refined */
.os-smallslider {
  display: grid;
  grid-template-columns: 80px 1fr 38px;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--line);
}
.os-smallslider:last-child { border-bottom: none; }
.os-smallslider .lab {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-soft);
}
.os-smallslider .val {
  font-family: var(--font-serif); font-size: 18px; line-height: 1;
  color: var(--ink); text-align: right;
  font-variant-numeric: tabular-nums;
}
.os-smallslider input[type="range"] {
  appearance: none; -webkit-appearance: none;
  width: 100%; height: 4px; background: var(--line);
  outline: none; cursor: pointer;
}
.os-smallslider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); border: 2px solid #fff;
  box-shadow: 0 0 0 1px var(--accent);
}
.os-smallslider.problem  input[type="range"]::-webkit-slider-thumb { background: var(--cat-problem);  box-shadow: 0 0 0 1px var(--cat-problem); }
.os-smallslider.solution input[type="range"]::-webkit-slider-thumb { background: var(--cat-solution); box-shadow: 0 0 0 1px var(--cat-solution); }
.os-smallslider.tech     input[type="range"]::-webkit-slider-thumb { background: var(--cat-tech);     box-shadow: 0 0 0 1px var(--cat-tech); }
.os-smallslider.founders input[type="range"]::-webkit-slider-thumb { background: var(--cat-founders); box-shadow: 0 0 0 1px var(--cat-founders); }
.os-smallslider.commit   input[type="range"]::-webkit-slider-thumb { background: var(--cat-commit);   box-shadow: 0 0 0 1px var(--cat-commit); }
.os-smallslider.integrity input[type="range"]::-webkit-slider-thumb { background: var(--cat-integrity); box-shadow: 0 0 0 1px var(--cat-integrity); }

/* Vote buttons — brand */
.os-reco-btn.yes.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.os-reco-btn.maybe.active { background: var(--brand-amber); border-color: var(--brand-amber); color: var(--ink); }
.os-reco-btn.no.active { background: var(--brand-coral); border-color: var(--brand-coral); color: #fff; }

/* Soft reference card */
.os-card.soft { background: var(--bg-soft); border-color: var(--line); }

/* Deliberation table — vote bar segments */
.os-vote-bar { display: inline-flex; gap: 3px; }
.os-vote-bar .seg {
  width: 14px; height: 14px;
  border: 1px solid transparent;
}
.os-vote-bar .seg.yes   { background: var(--accent); }
.os-vote-bar .seg.maybe { background: var(--brand-amber); }
.os-vote-bar .seg.no    { background: var(--brand-coral); }

.os-checkbox {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border: 1.5px solid var(--line-strong);
  background: var(--bg-paper); font-size: 11px; color: #fff;
  font-family: var(--font-mono);
}
.os-checkbox.on { background: var(--accent); border-color: var(--accent); }

.os-deliberation tbody tr.is-selected { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }
.os-deliberation tbody tr.is-blocked { opacity: 0.5; }
.os-deliberation tbody tr:hover:not(.is-blocked) { background: var(--bg-soft); }
.os-deliberation tbody tr.is-selected:hover { background: var(--accent-soft); }

.os-deliberation-summary {
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px;
}

/* =========================================================
   LEADERSHIP PANEL — matches production screenshots exactly
   ========================================================= */

/* ── Topbar ─────────────────────────────────────────────── */
.lp-topbar {
  display: flex; align-items: center; height: 60px; gap: 20px;
  padding: 0 28px; border-bottom: 1px solid #e3e3e8;
  background: #fff; flex-shrink: 0;
}
.lp-home-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 17px; background: #fff;
  border: 1px solid #e3e3e8; border-radius: 6px;
  font-family: var(--font-display); font-size: 13px; font-weight: 600;
  letter-spacing: 0.05em; color: #242424; cursor: pointer;
  flex-shrink: 0; white-space: nowrap; -webkit-font-smoothing: antialiased;
}
.lp-home-btn:hover { background: #f6f6f8; border-color: #c8c8d0; }
.lp-brand {
  display: flex; align-items: center; gap: 9px;
  flex: 0 0 auto;
}
.lp-brand-iisc { height: 38px; width: auto; display: block; }
.lp-brand-logo { height: 28px; width: auto; display: block; }
.lp-brand-combined { height: 54px; width: auto; display: block; background: #fff; border-radius: var(--r-sharp, 2px); padding: 2px 4px; }
.lp-brand-icon { width: 24px; height: 24px; flex-shrink: 0; color: #242424; }
/* Role pill is centered in the topbar (matches Admin portal) */
.lp-topbar-crumb {
  flex: 1; display: flex; align-items: center; justify-content: center;
}
.lp-topbar-pill {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 7px 15px; border: 1px solid #e3e3e8; border-radius: 999px;
  font-family: var(--font-body); font-size: 12px; letter-spacing: 0.08em;
  text-transform: uppercase; color: #4a4a52; font-weight: 600;
  background: #fff; white-space: nowrap; -webkit-font-smoothing: antialiased;
}
.lp-topbar-pill .lp-live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #3213b7; flex-shrink: 0; display: inline-block;
}
/* Spacer — push the user chip + sign-out to the far right */
.lp-topbar-right { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; margin-left: auto; }
.lp-topbar-user-wrap { position: relative; }
.lp-topbar-user {
  display: flex; align-items: center; gap: 9px;
  font-family: var(--font-sans); font-size: 14px; color: #242424; cursor: pointer;
  white-space: nowrap; -webkit-font-smoothing: antialiased;
  background: transparent; border: none; padding: 4px 6px; border-radius: 8px;
}
.lp-topbar-user:hover { background: var(--paper-soft); }
.lp-topbar-user .caret { font-size: 10px; color: #8a8a92; }

/* Role switcher dropdown (same ID, multi-role) */
.lp-menu-backdrop { position: fixed; inset: 0; z-index: 90; }
.lp-role-menu {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 100;
  min-width: 210px; padding: 6px;
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 14px 36px rgba(36,36,36,0.14);
}
.lp-role-menu-head {
  font-family: var(--font-body); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-dim); padding: 8px 10px 6px;
}
.lp-role-item {
  width: 100%; display: flex; align-items: center; gap: 9px;
  padding: 9px 10px; background: transparent; border: none; cursor: pointer;
  font-family: var(--font-sans); font-size: 14px; color: var(--ink);
  border-radius: 7px; text-align: left;
}
.lp-role-item:hover { background: var(--paper-soft); }
.lp-role-item.is-active { color: var(--artblue); font-weight: 600; }
.lp-role-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim); flex-shrink: 0; }
.lp-role-item.is-active .lp-role-dot { background: var(--artblue); }
.lp-role-check { margin-left: auto; color: var(--artblue); font-size: 13px; }
.lp-signout {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 17px; background: #fff;
  border: 1px solid #e3e3e8; border-radius: 6px;
  font-family: var(--font-display); font-size: 13px; font-weight: 600;
  letter-spacing: 0.05em; color: #242424; cursor: pointer;
  white-space: nowrap; -webkit-font-smoothing: antialiased;
}
.lp-signout:hover { background: #f6f6f8; border-color: #c8c8d0; }

/* ── Page header ─────────────────────────────────────────── */
.lp-page-header {
  padding: 26px 40px 0;
  background: #fff; flex-shrink: 0;
}
.lp-breadcrumb {
  font-family: var(--font-sans); font-size: 14px; font-weight: 400;
  color: #8a8a92; letter-spacing: 0; -webkit-font-smoothing: antialiased;
}
.lp-header-row {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; padding-bottom: 26px; padding-top: 12px;
}
.lp-cohort-title {
  font-family: var(--font-display); font-weight: 700; font-size: 38px;
  line-height: 1.05; letter-spacing: -0.01em; margin: 0; color: #242424;
  -webkit-font-smoothing: antialiased;
}
.lp-cohort-title .lp-year { color: #3213b7; font-weight: 700; font-style: italic; }
.lp-cohort-sub {
  font-size: 15px; color: #8a8a92; margin-top: 10px;
  font-family: var(--font-sans); letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
}

/* ── Tab bar ─────────────────────────────────────────────── */
.lp-tabs {
  display: flex; gap: 48px; padding: 0 40px; flex-shrink: 0;
  border-bottom: 1px solid #e3e3e8; background: #fff;
}
.lp-tab {
  display: flex; flex-direction: column; gap: 5px;
  padding: 16px 0 14px; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  user-select: none;
}
.lp-tab:hover .lp-tab-label { color: #242424; }
.lp-tab.active { border-bottom-color: #3213b7; }
.lp-tab-label {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-sans); font-size: 22px; font-weight: 500;
  letter-spacing: -0.01em; color: #4a4a52; -webkit-font-smoothing: antialiased;
}
.lp-tab.active .lp-tab-label { color: #242424; font-weight: 700; }
.lp-tab-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 30px; height: 24px; padding: 0 9px;
  background: transparent; color: #4a4a52;
  border: 1px solid #c8c8d0;
  font-family: var(--font-mono); font-size: 12px; border-radius: 999px;
}
.lp-tab.active .lp-tab-badge { color: #3213b7; border-color: #ccc2f0; }
.lp-tab-sub {
  font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase; color: #8a8a92;
  white-space: nowrap;
}

/* ── Filter area ─────────────────────────────────────────── */
.lp-filter-area {
  padding: 22px 40px 20px;
  background: #fff;
  border-bottom: 1px solid #e3e3e8;
  flex-shrink: 0;
}

/* Search + track row — wrapped in its own bordered card */
.lp-filter-row--search {
  display: flex; align-items: center; flex-wrap: nowrap; gap: 14px;
  padding: 12px 16px;
  border: 1px solid #e3e3e8; border-radius: 6px;
  margin-bottom: 14px;
}
.lp-filter-row--search .os-search-wrap { flex: 0 1 360px; }
.lp-filter-row--search .os-search-wrap::before { display: none; }
.lp-filter-row--search .os-input.search {
  width: 100%; height: 40px; padding: 0 16px;
  font-size: 14px; border: 1px solid #c8c8d0; border-radius: 3px;
  color: #242424;
}
.lp-filter-row--search .os-input.search::placeholder { color: #8a8a92; }

/* STATUS / STAGE / INDUSTRY blocks — each its own bordered box, label inline-left */
.lp-filter-section {
  display: flex; align-items: center; gap: 18px;
  padding: 12px 16px;
  border: 1px solid #e3e3e8;
  border-radius: 6px;
  margin-bottom: 12px;
}
.lp-filter-section:last-child { margin-bottom: 0; }

/* Label sits inline to the left of the buttons */
.lp-filter-label {
  flex-shrink: 0; align-self: center;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: #8a8a92;
  margin: 0; white-space: nowrap;
}

/* Buttons row inside each section */
.lp-filter-btns {
  flex: 1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}

/* ── Filter buttons ──────────────────────────────────────── */
.lp-filter-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 0 12px; height: 32px;
  background: #fff; border: 1px solid #c8c8d0;
  font-family: var(--font-sans); font-size: 13px; font-weight: 400;
  color: #4a4a52; cursor: pointer; border-radius: 3px;
  white-space: nowrap; line-height: 1;
  transition: background 80ms, border-color 80ms, color 80ms;
  -webkit-font-smoothing: antialiased;
}
.lp-filter-btn:hover { background: #f6f6f8; border-color: #8a8a92; color: #242424; }
.lp-filter-btn.active {
  background: #242424; border-color: #242424; color: #fff;
}
.lp-filter-btn .sdot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0; display: inline-block;
}
.lp-clear-btn { color: #4a4a52; border-color: #c8c8d0; }
.lp-count {
  font-family: var(--font-mono); font-size: 13px;
  color: #8a8a92; white-space: nowrap; flex-shrink: 0;
}

/* ── Filters toggle (collapsible, e-commerce style — matches Admin) ── */
.lp-filters-toggle {
  display: inline-flex; align-items: center; gap: 7px;
  height: 38px; padding: 0 14px; flex-shrink: 0;
  background: var(--bg-paper, #fff); border: 1px solid var(--line-strong, #c8c8d0);
  border-radius: 999px; cursor: pointer;
  font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--ink, #242424);
  transition: all 0.15s ease;
}
.lp-filters-toggle:hover { background: var(--bg-soft, #f6f6f8); border-color: var(--ink-dim, #8a8a92); }
.lp-filters-toggle.is-open { border-color: var(--accent, #3213b7); color: var(--accent, #3213b7); background: var(--accent-soft, #d8d0f3); }
.lp-filters-count {
  display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px;
  background: var(--accent, #3213b7); color: #fff; border-radius: 999px;
  font-size: 11px; font-weight: 700; line-height: 1;
}
.lp-filters-caret { font-size: 9px; color: var(--ink-dim, #8a8a92); }
.lp-filters-toggle.is-open .lp-filters-caret { color: var(--accent, #3213b7); }

/* Applied filter pills */
.lp-active-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 0 2px; }
.lp-active-chip {
  display: inline-flex; align-items: center; gap: 8px;
  height: 28px; padding: 0 6px 0 12px;
  background: var(--accent-soft, #d8d0f3); border: 1px solid transparent;
  border-radius: 999px; cursor: pointer;
  font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--artblue, #3213b7);
  transition: background 0.15s ease;
}
.lp-active-chip:hover { background: #cabdf0; }
.lp-active-chip-x {
  display: inline-grid; place-items: center; width: 16px; height: 16px;
  border-radius: 50%; background: rgba(50,19,183,0.13); font-size: 13px; line-height: 1;
}
.lp-active-clear {
  background: none; border: none; cursor: pointer; padding: 0 6px;
  font-family: var(--font-sans); font-size: 12px; font-weight: 600;
  color: var(--ink-dim, #8a8a92); text-decoration: underline;
}
.lp-active-clear:hover { color: var(--ink, #242424); }

/* Collapsible panel */
.lp-filter-panel { margin-top: 10px; border-top: 1px solid var(--line, #e3e3e8); padding-top: 2px; }


/* Required-field indicators — bold red so jurors clearly see what's mandatory */
.os-required-tag {
  text-transform: none; letter-spacing: 0; font-weight: 700;
  font-size: 11px; color: #d23b40;
}
.os-required-msg {
  font-size: 11.5px; font-weight: 700; color: #d23b40; line-height: 1.4;
}

/* ── Track segmented control ─────────────────────────────── */
.lp-track-group { display: flex; flex-shrink: 0; }
.lp-track-btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 14px; height: 40px;
  background: #fff; border: 1px solid #c8c8d0; border-left: none;
  font-family: var(--font-sans); font-size: 14px; font-weight: 500;
  color: #4a4a52; cursor: pointer; white-space: nowrap;
  transition: background 80ms, color 80ms;
  -webkit-font-smoothing: antialiased;
}
.lp-track-btn:first-child {
  border-left: 1px solid #c8c8d0; border-radius: 3px 0 0 3px;
}
.lp-track-btn:last-child { border-radius: 0 3px 3px 0; }
.lp-track-btn:hover { background: #f6f6f8; color: #242424; }
.lp-track-btn.active {
  background: #242424; border-color: #242424; color: #fff;
  position: relative; z-index: 1;
}

/* ── Content + table ─────────────────────────────────────── */
.lp-content { flex: 1; }
.lp-tab-content { flex: 1; overflow: auto; padding: 36px 40px 80px; }
.lp-layout {
  display: flex; flex-direction: column;
  min-height: 0; background: #fff; overflow: auto;
}
.lp-content .os-table { width: 100%; border-collapse: collapse; }
.lp-content .os-table th,
.lp-content .os-table td { padding: 11px 12px; }
.lp-content .os-table th:first-child,
.lp-content .os-table td:first-child { padding-left: 40px; }
.lp-content .os-table th:last-child,
.lp-content .os-table td:last-child { padding-right: 40px; }

/* ── Score mini-bar ──────────────────────────────────────── */
.lp-score-bar { display: flex; align-items: center; gap: 8px; }
.lp-score-bar-track {
  width: 52px; height: 4px;
  background: #f6f6f8; border: none; border-radius: 2px;
  overflow: hidden; flex-shrink: 0;
}
.lp-score-bar-fill { height: 100%; background: #2f6f62; border-radius: 2px; }

/* Mid-breakpoint */
@media (max-width: 1280px) {
  .os-grid-juryconsole { grid-template-columns: 240px 1fr 280px; }
}
@media (max-width: 1024px) {
  .os-grid-juryconsole { grid-template-columns: 1fr; }
  .os-pitch-rail { position: static; }
}

/* ══════════════════════════════════════════════════════════
   REVIEWER DASHBOARD
══════════════════════════════════════════════════════════ */

.dash-scroll {
  flex: 1; overflow: auto;
  padding: 28px 32px 80px; display: flex; flex-direction: column; gap: 22px;
  background: #ffffff;
}

/* ── Stat tiles ────────────────────────────────────────── */
.dash-stat-grid {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 20px; border: none; border-radius: 0; overflow: visible;
  background: transparent; flex-shrink: 0;
}
.dash-stat-tile {
  padding: 30px 30px 28px; border: 1px solid #e3e3e8;
  border-radius: 2px; background: #f6f6f8;
}
.dash-tile-teal { background: #aafcf0 !important; border-color: #aafcf0 !important; }
.dash-tile-teal .dash-stat-label { color: #3213b7; }
.dash-tile-teal .dash-stat-num  { color: #3213b7; }
.dash-tile-teal .dash-stat-sub  { color: #2f6f62; }

.dash-stat-label {
  font-family: var(--font-sans); font-size: 11px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: #4a4a52; margin-bottom: 18px; -webkit-font-smoothing: antialiased;
}
.dash-stat-num {
  font-family: var(--font-display); font-size: 40px; font-weight: 400; color: #242424;
  line-height: 1; margin-bottom: 12px; letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}
.dash-stat-sub { font-size: 14px; color: #8a8a92; }

.dash-track-bars { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
.dash-track-row  { display: flex; align-items: center; gap: 8px; }
.dash-track-label { font-family: var(--font-sans); font-size: 11px; font-weight: 500; color: #8a8a92; width: 28px; flex-shrink: 0; }
.dash-track-bar-wrap { flex: 1; height: 4px; background: #e3e3e8; border-radius: 2px; overflow: hidden; }
.dash-track-bar-fill { height: 100%; border-radius: 2px; }
.dash-track-count { font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: #4a4a52; width: 28px; text-align: right; flex-shrink: 0; }

/* ── Cards ─────────────────────────────────────────────── */
.dash-card {
  background: #f6f6f8; border: 1px solid #e3e3e8;
  border-radius: 2px; padding: 34px 38px; flex-shrink: 0;
}
.dash-section-tag {
  font-family: var(--font-sans); font-size: 15px; font-weight: 400;
  letter-spacing: 0; color: #8a8a92; margin-bottom: 10px;
  -webkit-font-smoothing: antialiased;
}
.dash-card-title {
  font-family: var(--font-display); font-size: 22px; font-weight: 700; color: #242424;
  margin-bottom: 24px; letter-spacing: -0.01em;
}

/* ── Status funnel ─────────────────────────────────────── */
.dash-funnel { display: flex; flex-direction: column; gap: 10px; }
.dash-funnel-row { display: flex; align-items: center; gap: 16px; }
.dash-funnel-track {
  flex: 1; height: 28px; background: #f6f6f8;
  border-radius: 2px; overflow: hidden; position: relative;
}
.dash-funnel-fill {
  height: 100%; border-radius: 2px;
  display: flex; align-items: center; justify-content: flex-end;
  position: relative; min-width: 3%;
}
.dash-funnel-badge {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  background: rgba(0,0,0,0.35); color: #fff;
  padding: 2px 7px; border-radius: 2px; margin-right: 6px;
  white-space: nowrap;
}
.dash-funnel-info { width: 148px; flex-shrink: 0; }
.dash-funnel-name {
  display: block; font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.1em; font-weight: 600;
  color: #4a4a52; text-transform: uppercase;
}
.dash-funnel-sub { display: block; font-size: 10px; color: #8a8a92; margin-top: 2px; }

/* ── Pipeline funnel (matches dashboard screenshot) ──────── */
.dash-pipe { display: flex; flex-direction: column; }
.dash-pipe-row { display: flex; align-items: center; gap: 22px; }
.dash-pipe-track {
  flex: 1; height: 44px; background: #e3e3e8;
  border-radius: 2px; position: relative; overflow: hidden;
}
.dash-pipe-fill {
  height: 100%; border-radius: 2px; min-width: 0;
  background: linear-gradient(90deg, #1f0a8a 0%, #3213b7 100%);
}
.dash-pipe-badge { display: none; }
.dash-pipe-count {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-sans); font-size: 13px; font-weight: 600;
  color: #4a4a52; background: #e3e3e8;
  padding: 4px 14px; border-radius: 999px; white-space: nowrap;
}
.dash-pipe-info { width: 160px; flex-shrink: 0; }
.dash-pipe-name {
  display: block; font-family: var(--font-sans); font-size: 15px; font-weight: 700;
  letter-spacing: 0.03em; color: #242424; text-transform: uppercase;
  -webkit-font-smoothing: antialiased;
}
.dash-pipe-sub { display: block; font-size: 13px; color: #8a8a92; margin-top: 3px; }
.dash-pipe-arrow { display: flex; align-items: center; gap: 22px; padding: 6px 0; }
.dash-pipe-arrow .a-track { flex: 1; text-align: center; color: #c8c8d0; font-size: 13px; line-height: 1; }
.dash-pipe-arrow .a-spacer { width: 160px; flex-shrink: 0; }

/* ── 2-col grid ────────────────────────────────────────── */
.dash-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex-shrink: 0; }
.dash-2col .dash-card { margin-bottom: 0; }

/* ── Histogram ─────────────────────────────────────────── */
.dash-histogram {
  display: flex; align-items: flex-end; gap: 5px;
  height: 110px; margin-bottom: 12px;
}
.dash-hist-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; }
.dash-hist-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; }
.dash-hist-bar { width: 100%; background: #1f0a8a; border-radius: 2px 2px 0 0; min-height: 2px; }
.dash-hist-count { font-family: var(--font-mono); font-size: 9px; color: #4a4a52; margin-top: 3px; }
.dash-hist-label { font-family: var(--font-mono); font-size: 8px; color: #8a8a92; margin-top: 2px; }
.dash-hist-stats {
  font-family: var(--font-mono); font-size: 10px; color: #4a4a52;
  letter-spacing: 0.06em; border-top: 1px solid #e3e3e8; padding-top: 10px; margin-top: 4px;
}

/* ── Score components ──────────────────────────────────── */
.dash-comp-desc { font-size: 12px; color: #4a4a52; margin-bottom: 18px; line-height: 1.55; margin-top: -8px; }
.dash-comp-list { display: flex; flex-direction: column; gap: 16px; }
.dash-comp-meta { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
.dash-comp-name   { font-size: 13px; font-weight: 500; color: #242424; flex: 1; }
.dash-comp-weight { font-family: var(--font-mono); font-size: 10px; color: #8a8a92; }
.dash-comp-val    { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: #242424; }
.dash-comp-bar-wrap { height: 4px; background: #e3e3e8; border-radius: 2px; overflow: hidden; }
.dash-comp-bar-fill { height: 100%; background: #1f0a8a; border-radius: 2px; }

/* ── Industry breakdown ────────────────────────────────── */
.dash-ind-list { display: flex; flex-direction: column; gap: 11px; }
.dash-ind-row  { display: flex; align-items: center; gap: 12px; }
.dash-ind-name { width: 148px; flex-shrink: 0; font-size: 13px; color: #4a4a52; line-height: 1.3; }
.dash-ind-bar-wrap { flex: 1; height: 20px; background: #e3e3e8; border-radius: 2px; overflow: hidden; }
.dash-ind-bar-fill { height: 100%; background: #1f0a8a; border-radius: 2px; transition: width 0.3s ease; }
.dash-ind-count { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: #242424; width: 28px; text-align: right; flex-shrink: 0; }
.dash-ind-pct   { font-family: var(--font-mono); font-size: 11px; color: #8a8a92; width: 56px; flex-shrink: 0; }
.dash-ind-row--clickable { cursor: pointer; padding: 5px 8px; margin: 0 -8px; border-radius: 4px; transition: background 0.12s ease; }
.dash-ind-row--clickable:hover { background: var(--paper-soft); }
.dash-ind-row--clickable:hover .dash-ind-name { color: var(--artblue); }
.dash-ind-filter { display: flex; align-items: flex-start; gap: 12px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }

/* ══════════════════════════════════════════════════════════
   SECTION HEADERS inside tab content (eval / history)
   — sans/hp, consistent with the queue page
══════════════════════════════════════════════════════════ */
.lp-section-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 28px; margin-bottom: 28px;
}
.lp-section-eyebrow {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; color: #8a8a92; display: block;
}
.lp-section-title {
  font-family: var(--font-display); font-weight: 700; font-size: 28px;
  letter-spacing: -0.01em; line-height: 1.15; color: #242424; margin: 10px 0 0;
  -webkit-font-smoothing: antialiased;
}
.lp-section-title .lp-muted { color: #8a8a92; font-weight: 700; }
.lp-section-title em { font-style: italic; color: #3213b7; }
.lp-section-sub {
  font-size: 15px; color: #4a4a52; margin-top: 11px; max-width: 70ch;
  line-height: 1.55; -webkit-font-smoothing: antialiased;
}
.lp-section-actions {
  display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  flex-shrink: 0;
}

/* Stat tiles reused on the history page */
.lp-stat-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  border: 1px solid #e3e3e8; border-radius: 6px; overflow: hidden;
  background: #fff; margin-bottom: 28px;
}
.lp-stat-grid .dash-stat-tile { padding: 22px 24px; }

/* Edit-window chip on the eval toolbar */
.lp-edit-chip {
  display: inline-flex; align-items: center; gap: 8px; height: 36px;
  padding: 0 14px; border-radius: 6px; font-size: 13px; font-weight: 600;
  white-space: nowrap; -webkit-font-smoothing: antialiased;
}
.lp-edit-chip.amber { background: #fbf3e0; border: 1px solid #ecd9a8; color: #92400e; }
.lp-edit-chip.red   { background: #ffecec; border: 1px solid #ffc4c5; color: #ff5a5f; }
.lp-edit-chip .lp-edit-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

/* === Async UI states (loading / error / empty) — added with the API seam === */
.rv-async { display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 28px 16px; text-align: center; color: var(--ink-dim); }
.rv-async-loading { flex-direction: row; font-size: 13px; }
.rv-spinner { width: 16px; height: 16px; border: 2px solid var(--line-strong);
  border-top-color: var(--artblue); border-radius: 50%; animation: rv-spin 0.7s linear infinite; }
@keyframes rv-spin { to { transform: rotate(360deg); } }
.rv-async-empty { font-size: 13px; }

/* === Application content panel (eval screen) — beautified per review === */
/* AI summary as a pinned TL;DR card (ARTBlue-led, restrained per brand). */
.ps-ai-summary {
  background: #f2effb;                 /* light indigo wash */
  border: 1px solid #e2dbf6; border-left: 3px solid var(--artblue);
  border-radius: 10px; padding: 16px 20px;
}
.ps-ai-label {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-body); font-weight: 700; font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--artblue);
  margin-bottom: 9px;
}
.ps-ai-label::before { content: ""; width: 20px; height: 2px; background: var(--artblue); display: inline-block; }
.ps-ai-text { margin: 0; font-size: 14.5px; line-height: 1.72; color: var(--ink-soft); }

.ps-head {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  background: transparent; border: none; cursor: pointer; padding: 6px 0;
  font-family: var(--font-display); text-align: left;
}
.ps-head-title { font-weight: 700; font-size: 16px; color: var(--ink); letter-spacing: -0.01em; }
.ps-head-chev { color: var(--ink-dim); font-size: 12px; }

/* Group heading above the collapsible sections */
.ps-group-label {
  font-family: var(--font-display); font-weight: 700; font-size: 19px;
  color: var(--ink); letter-spacing: -0.01em; margin: 2px 0 14px;

.ps-facts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.ps-fact {
  display: inline-flex; flex-direction: column; gap: 5px;
  padding: 11px 16px 12px; background: var(--paper);
  border: 1px solid var(--line); border-top: 2px solid var(--artblue);
  border-radius: 10px; min-width: 136px;
}
.ps-fact-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); }
.ps-fact-value { font-size: 15px; font-weight: 700; color: var(--ink); }

/* Collapsible AI sections — a clean card accordion (inviting to read) */
.ps-sections { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
.ps-sec {
  border: 1px solid var(--line); border-radius: 12px; background: var(--paper);
  overflow: hidden; transition: border-color 140ms ease, box-shadow 140ms ease;
}
.ps-sec:hover { border-color: var(--line-strong); }
.ps-sec.is-open { border-color: #d9d0f5; box-shadow: 0 6px 20px rgba(50,19,183,0.06); }
.ps-sec-head {
  width: 100%; display: flex; align-items: center; gap: 12px;
  background: transparent; border: none; cursor: pointer;
  padding: 15px 18px; text-align: left; font-family: var(--font-body);
}
.ps-sec.is-open .ps-sec-head { background: #f7f5fd; }
.ps-sec-chev { color: var(--artblue); font-size: 11px; width: 12px; flex-shrink: 0; }
.ps-sec-label {
  flex: 1; font-family: var(--font-display); font-weight: 700; font-size: 16px;
  letter-spacing: -0.01em; text-transform: none; color: var(--ink); line-height: 1.25;
}
.ps-sec.is-open .ps-sec-label { color: var(--artblue); }
.ps-sec-head:hover .ps-sec-label { color: var(--ink); }
.ps-sec.is-open .ps-sec-head:hover .ps-sec-label { color: var(--artblue); }
.ps-sec-hint { font-size: 11px; letter-spacing: 0.02em; color: var(--ink-dim); flex-shrink: 0; }

/* AI output as scannable 1-sentence bullets */
.ps-bullets { margin: 0; padding: 4px 20px 18px 22px; list-style: none; display: flex; flex-direction: column; gap: 11px; max-width: 70ch; }
.ps-bullets li {
  position: relative; padding-left: 18px;
  font-size: 14px; line-height: 1.62; color: var(--ink-soft);
}
.ps-bullets li::before {
  content: ""; position: absolute; left: 2px; top: 8px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--artblue);
}

/* === Reviewer rubric (modal) — clean, brand-aligned (replaces dark code block) === */
.rubric { font-family: var(--font-sans); }
.rubric-intro { font-size: 14px; color: var(--ink-soft); margin: 0 0 22px; }
.rubric-cat { margin-bottom: 22px; }
.rubric-cat:last-child { margin-bottom: 0; }
.rubric-cat-name {
  font-family: var(--font-body); font-weight: 700; font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--artblue);
  margin: 0 0 12px; padding-bottom: 9px; border-bottom: 1px solid var(--line);
}
.rubric-anchors { display: flex; flex-direction: column; gap: 9px; }
.rubric-anchor { display: flex; align-items: flex-start; gap: 13px; }
.rubric-score {
  flex-shrink: 0; min-width: 30px; height: 24px; padding: 0 6px;
  display: inline-grid; place-items: center; border-radius: 6px;
  font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums;
}
.rubric-hi   { background: #e7f1ee; color: #2f6f62; }
.rubric-mid  { background: #ece9fb; color: var(--artblue); }
.rubric-lo   { background: #fbf3e0; color: #92400e; }
.rubric-weak { background: #f3e0d8; color: #b85a3a; }
.rubric-desc { font-size: 14px; line-height: 1.5; color: var(--ink); padding-top: 2px; }
.rubric-notes { margin: 4px 0 0; padding-left: 18px; }
.rubric-notes li { font-size: 13.5px; line-height: 1.6; color: var(--ink-soft); margin-bottom: 5px; }

/* === Notes textarea — comfortable, auto-growing, seamless === */
.notes-area {
  width: 100%; min-height: 132px; resize: vertical;

  transition: border-color 140ms ease, box-shadow 140ms ease;

.notes-area::placeholder { color: var(--ink-dim); }
.notes-area:hover { border-color: var(--ink-soft); }
.notes-area:focus { outline: none; border-color: var(--artblue); box-shadow: 0 0 0 3px rgba(50,19,183,0.12); }
.notes-area:disabled { background: var(--paper-soft); color: var(--ink-soft); cursor: not-allowed; }
