AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ARTPARK EIR API — FastAPI on Lambda + HTTP API Gateway (Phase 9B)

# ─── Conditions ──────────────────────────────────────────────────────
Conditions:
  # Prod CORS stays locked to the production origin; non-prod (staging/dev)
  # additionally allows the Vercel preview URLs. Uses a literal-list Fn::If
  # (NOT !Split) to dodge the SAM transform bug noted at CorsConfiguration.
  IsProduction: !Equals [!Ref EnvName, production]

# ─── Parameters ──────────────────────────────────────────────────────
# Non-secret params are passed plainly; secrets are NoEcho so they never
# appear in CloudFormation events / console audit trails.
Parameters:
  EnvName:
    Type: String
    AllowedValues: [dev, staging, production]
    Default: production
  FrontendOrigin:
    Type: String
    Description: "Comma-separated list of allowed origins (e.g. https://apply.artpark.info)"
  SupabaseUrl:
    Type: String
  SupabaseAnonKey:
    Type: String
    NoEcho: true
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
  OpenRouterApiKey:
    Type: String
    NoEcho: true
  OpenRouterModel:
    Type: String
    Default: google/gemini-2.5-flash
  AiStub:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      "true" = deterministic stub scores (no OpenRouter spend).
      "false" = real Gemini Flash scoring via the worker Lambda.
  SentryDsn:
    Type: String
    NoEcho: true
    Default: ""
  AdminApiKey:
    Type: String
    NoEcho: true
  ResendApiKey:
    Type: String
    NoEcho: true
    Description: Resend API key (re_...) used for transactional email (Phase 9E migration from SES)
  AppVersion:
    Type: String
    Default: 0.1.0
  LogLevel:
    Type: String
    AllowedValues: [DEBUG, INFO, WARN, ERROR]
    Default: INFO
  SesFromEmail:
    Type: String
    Default: noreply@artpark.info
  AwsRegionParam:
    Type: String
    Default: ap-south-1
  AlarmsTopic:
    Type: String
    Description: SNS topic ARN for prod alarm notifications
    Default: "arn:aws:sns:ap-south-1:348287123004:artpark-prod-alarms"
  TirSubmissionsClosed:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      "true" closes the TIR track to new intake (no new TIR account creation,
      no new draft, no submission). Existing TIR applicants keep sign-in / view
      / edit-window access; SIP/VIP is unaffected. Reversible — flip and redeploy.
  SipSubmissionsClosed:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      "true" closes the SIP/VIP track to new intake (no new VIP account
      creation, no new draft, no submission). Existing VIP applicants keep
      sign-in / view / edit-window access; TIR is unaffected. Reversible.

# ─── Globals: every function inherits these ──────────────────────────
# arm64 + python3.11 + 1GB RAM is the sweet spot for FastAPI on Lambda:
# 1GB gets us a full vCPU which halves cold-start parsing time; arm64 is
# ~20% cheaper and ships the same wheels as x86 for our deps.
Globals:
  Function:
    Runtime: python3.11
    Architectures: [arm64]
    MemorySize: 1024
    Timeout: 29
    Tracing: Active
    Environment:
      Variables:
        APP_ENV: !Ref EnvName
        APP_VERSION: !Ref AppVersion
        LOG_LEVEL: !Ref LogLevel
        FRONTEND_ORIGIN: !Ref FrontendOrigin
        FRONTEND_ORIGINS: !Ref FrontendOrigin
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_ANON_KEY: !Ref SupabaseAnonKey
        SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
        OPENROUTER_API_KEY: !Ref OpenRouterApiKey
        OPENROUTER_MODEL: !Ref OpenRouterModel
        SENTRY_DSN: !Ref SentryDsn
        ADMIN_API_KEY: !Ref AdminApiKey
        SES_FROM_EMAIL: !Ref SesFromEmail
        # Transactional email now routes through Resend (Phase 9E); the name
        # SES_FROM_EMAIL is retained for back-compat with existing callers.
        RESEND_API_KEY: !Ref ResendApiKey
        # Lambda reserves AWS_REGION and pre-sets it to the runtime region.
        # Our Settings class reads AWS_REGION_APP first so we can override it
        # via the SAM template; AWS_REGION remains the fallback locally.
        AWS_REGION_APP: !Ref AwsRegionParam
        # AI screening pipeline (Phase 1, Session 7). The API Lambda publishes
        # to this queue on submit; the worker Lambda consumes from it. Both
        # functions inherit the URL via Globals because the same env var is
        # safe in either role (the worker reads SQS via event source mapping,
        # not via the URL directly, but having it set helps debugging).
        AI_SCREENING_QUEUE_URL: !Ref AiScreenerQueue
        # TIR intake close — "true" blocks new TIR accounts/drafts/submissions.
        # Parameterised so prod can close while staging stays open.
        TIR_SUBMISSIONS_CLOSED: !Ref TirSubmissionsClosed
        # SIP/VIP intake close — same semantics for the VIP track.
        SIP_SUBMISSIONS_CLOSED: !Ref SipSubmissionsClosed

Resources:
  # ── Lambda function ─────────────────────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub artpark-eir-api-${EnvName}
      CodeUri: ../../backend/
      Handler: app.main.handler
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - CloudWatchLogsFullAccess
      # Phase 9E: SES IAM permissions removed — transactional email now
      # routes through Resend's HTTP API (auth is the RESEND_API_KEY env var,
      # not AWS IAM). boto3 stays in requirements.txt for future AWS work
      # (Sentry spans, S3 signed URLs, SES bounce handling, etc.) but this
      # Lambda currently makes no SES calls.

  # ── HTTP API Gateway ────────────────────────────────────────────
  # CORS is enforced BOTH at the gateway (below) and inside FastAPI
  # (CORSMiddleware). Gateway catches preflights so the Lambda stays cold
  # for them; FastAPI still enforces the allow-list for actual requests.
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub artpark-eir-api-${EnvName}
      DisableExecuteApiEndpoint: false
      CorsConfiguration:
        # CORS origins are listed statically here because the SAM
        # transform mishandles !Split inside CorsConfiguration.AllowOrigins
        # (it hoists the Fn::Split to replace the entire
        # x-amazon-apigateway-cors block, wiping AllowMethods/AllowHeaders).
        # FrontendOrigin (the env var) is still set to the comma-joined
        # value so FastAPI's own CORS middleware can use it for non-
        # API-Gateway code paths.
        AllowOrigins: !If
          - IsProduction
          - - "https://apply.artpark.info"
          - - "https://apply.artpark.info"
            - "https://ap-os-git-staging-artpark.vercel.app"
            - "https://ap-os-git-staging-rolebaseddashboard-artpark.vercel.app"
            - "https://ap-os-git-reviewer-v2-pilot-artpark.vercel.app"
            - "https://ap-os-git-newsubmissionedit-artpark.vercel.app"
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type, X-Request-ID, X-Admin-Key]
        AllowCredentials: true
        ExposeHeaders: [X-Request-ID]
        MaxAge: 600

  # ── CloudWatch log group ────────────────────────────────────────
  # Declared explicitly (not auto-created by Lambda) so we can pin
  # retention. Matches the function name Lambda will write to.
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/artpark-eir-api-${EnvName}
      RetentionInDays: 30

  # ── CloudWatch alarms ───────────────────────────────────────────
  # Three API health alarms publishing to the prod SNS topic
  # (created out-of-band). TreatMissingData: notBreaching so a cold
  # function with no invocations doesn't page us.
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "artpark-eir-api-${EnvName}-errors"
      AlarmDescription: "API Lambda Errors > 0 in any 5-min window"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmsTopic
      OKActions:
        - !Ref AlarmsTopic

  ApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "artpark-eir-api-${EnvName}-throttles"
      AlarmDescription: "API Lambda Throttles > 0"
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmsTopic

  ApiP99DurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "artpark-eir-api-${EnvName}-p99-duration"
      AlarmDescription: "API Lambda Duration p99 > 25000 ms"
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      Threshold: 25000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmsTopic

  # ── AI screening pipeline (Phase 1, Session 7) ──────────────────
  # The submit endpoint enqueues {application_id, application_track}
  # onto AiScreenerQueue. AiScreenerFunction consumes from it, scores
  # the application (stub-mode by default; real Gemini when AI_STUB=
  # false), and writes to ai_screening. Failures retry up to 3× via
  # the FIFO queue's redrive policy; persistent failures land in the
  # DLQ and fire the alarm below.

  # Dead-letter queue — receives messages after 3 failed receives on
  # the main queue. FIFO so messageId/group-id semantics are preserved
  # for forensics. 14-day retention gives operators time to inspect
  # before deletion.
  AiScreenerDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub artpark-eir-ai-screener-dlq-${EnvName}.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      MessageRetentionPeriod: 1209600  # 14 days

  # Main queue — FIFO so retries for one application stay ordered
  # relative to each other. Content-based dedup means duplicate
  # publishes (e.g. retry of submit due to network flap) are absorbed
  # within the dedup window. Visibility timeout = worker timeout + slack.
  AiScreenerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub artpark-eir-ai-screener-${EnvName}.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AiScreenerDLQ.Arn
        maxReceiveCount: 3

  # Grant the API Lambda permission to publish onto the queue. Done
  # as a standalone IAM::Policy (not by editing ApiFunction.Policies)
  # so this addition is a pure append against the existing function.
  ApiFunctionAiScreenerSendPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub artpark-eir-api-${EnvName}-ai-screener-send
      Roles:
        - !Ref ApiFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt AiScreenerQueue.Arn

  # Worker Lambda — same backend codebase as the API, different
  # handler entrypoint. Reserved concurrency caps fan-out so the
  # downstream OpenRouter rate limit isn't exceeded on deadline-day
  # spikes (a 500-burst still gets fully scored, just in ~minutes
  # rather than seconds). Partial-batch-response means a single bad
  # message doesn't replay the whole batch.
  AiScreenerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub artpark-eir-ai-screener-${EnvName}
      CodeUri: ../../backend/
      Handler: workers.ai_screener.handler.lambda_handler
      Timeout: 60
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          # Phase 1 default: deterministic stub scores so the
          # dashboard works without burning OpenRouter spend. Flip to
          # "false" + redeploy (or override in the Lambda console) to
          # call the real Gemini Flash model.
          AI_STUB: !Ref AiStub
      Events:
        AiScreeningJobs:
          Type: SQS
          Properties:
            Queue: !GetAtt AiScreenerQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Policies:
        - CloudWatchLogsFullAccess
        - SQSPollerPolicy:
            QueueName: !GetAtt AiScreenerQueue.QueueName

  AiScreenerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/artpark-eir-ai-screener-${EnvName}
      RetentionInDays: 30

  # Alarm fires the moment any message lands in the DLQ. There's no
  # automatic notification target wired in Phase 1 — operators see it
  # via the CloudWatch console and the leadership dashboard's "AI
  # scoring failed" chip (which reads from ai_screening.error).
  AiScreenerDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub artpark-eir-ai-screener-dlq-not-empty-${EnvName}
      AlarmDescription: AI screening DLQ has at least one message — investigate.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AiScreenerDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  DailyDigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub artpark-eir-daily-digest-${EnvName}
      CodeUri: ../../backend/
      Handler: workers.daily_digest.handler.lambda_handler
      Timeout: 60
      Events:
        DailyMorning:
          Type: Schedule
          Properties:
            # 02:30 UTC = 08:00 IST, every day
            Schedule: "cron(30 2 * * ? *)"
      Policies:
        - CloudWatchLogsFullAccess

  DailyDigestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/artpark-eir-daily-digest-${EnvName}
      RetentionInDays: 30

Outputs:
  ApiUrl:
    Description: Execute-API URL (before custom domain)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  HttpApiId:
    Value: !Ref HttpApi
    Export:
      Name: !Sub ${AWS::StackName}-HttpApiId
  ApiFunctionArn:
    Value: !GetAtt ApiFunction.Arn
  AiScreenerQueueUrl:
    Description: FIFO queue the API Lambda publishes to and the worker consumes from
    Value: !Ref AiScreenerQueue
  AiScreenerDLQUrl:
    Description: Dead-letter queue for AI-screening jobs that failed 3× in a row
    Value: !Ref AiScreenerDLQ
  AiScreenerFunctionArn:
    Value: !GetAtt AiScreenerFunction.Arn
